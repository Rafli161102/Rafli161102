<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Signal field — ideas in motion</title>
  <desc id="desc">An original abstract field of curved signal paths and quiet pulsing nodes, animated in a dark cyan and violet palette.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1018"/>
      <stop offset="1" stop-color="#0D1420"/>
    </linearGradient>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2=".2">
      <stop offset="0" stop-color="#45F5CF" stop-opacity=".05"/>
      <stop offset=".38" stop-color="#45F5CF" stop-opacity=".85"/>
      <stop offset=".7" stop-color="#9B8CFF" stop-opacity=".65"/>
      <stop offset="1" stop-color="#9B8CFF" stop-opacity=".08"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#233143" stroke-opacity=".48" stroke-width=".7"/>
    </pattern>
    <filter id="soft-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="inside"><rect x="1" y="1" width="1198" height="298" rx="14"/></clipPath>
  </defs>
  <g clip-path="url(#inside)">
    <rect width="1200" height="300" rx="14" fill="url(#bg)"/>
    <rect width="1200" height="300" fill="url(#grid)" opacity=".7"/>
    <path d="M0 244H1200" stroke="#243346" stroke-width="1"/>
    <path d="M0 44H1200" stroke="#243346" stroke-width="1"/>
    <text x="30" y="29" fill="#8495A9" font-family="monospace" font-size="11" letter-spacing="2.5">FIELD NOTE 01 / OPEN SYSTEM</text>
    <text x="1170" y="29" text-anchor="end" fill="#45F5CF" font-family="monospace" font-size="11" letter-spacing="2">IDEAS IN MOTION</text>

    <g fill="none" stroke-linecap="round">
      <path d="M-60 205 C85 38 140 282 282 157 S480 40 578 164 S762 277 886 126 S1082 61 1260 177" stroke="url(#flow)" stroke-width="1.5" opacity=".8"/>
      <path d="M-40 232 C94 92 154 260 300 178 S477 70 592 177 S778 239 898 152 S1085 91 1240 204" stroke="#45F5CF" stroke-width=".8" stroke-opacity=".45" stroke-dasharray="3 13">
        <animate attributeName="stroke-dashoffset" values="0;-128" dur="18s" repeatCount="indefinite"/>
      </path>
      <path d="M-30 174 C100 12 190 228 315 130 S505 56 618 147 S800 282 925 101 S1090 130 1240 136" stroke="#9B8CFF" stroke-width=".8" stroke-opacity=".4" stroke-dasharray="2 16">
        <animate attributeName="stroke-dashoffset" values="0;144" dur="24s" repeatCount="indefinite"/>
      </path>
      <path d="M-10 266 C120 144 205 302 352 197 S520 103 644 199 S824 267 951 185 S1090 152 1230 246" stroke="#52758B" stroke-width="1" stroke-opacity=".55"/>
      <path d="M-20 124 C110 7 196 165 330 94 S519 89 646 125 S812 207 947 94 S1114 47 1235 105" stroke="url(#flow)" stroke-width="1" stroke-opacity=".68"/>
      <path d="M-30 218 C105 82 214 270 344 164 S542 52 668 166 S842 248 960 139 S1104 104 1240 190" stroke="#6B83A5" stroke-width=".7" stroke-opacity=".5" stroke-dasharray="1 9">
        <animate attributeName="stroke-dashoffset" values="0;-90" dur="15s" repeatCount="indefinite"/>
      </path>
    </g>

    <g fill="#45F5CF" filter="url(#soft-glow)">
      <circle cx="170" cy="170" r="2.2"><animate attributeName="opacity" values=".35;1;.35" dur="3.2s" repeatCount="indefinite"/></circle>
      <circle cx="355" cy="133" r="2.7"><animate attributeName="opacity" values=".25;.9;.25" dur="4.5s" repeatCount="indefinite"/></circle>
      <circle cx="575" cy="164" r="2.4"><animate attributeName="opacity" values=".4;1;.4" dur="3.6s" repeatCount="indefinite"/></circle>
      <circle cx="805" cy="199" r="2.2"><animate attributeName="opacity" values=".25;.85;.25" dur="5s" repeatCount="indefinite"/></circle>
      <circle cx="1035" cy="108" r="2.4"><animate attributeName="opacity" values=".3;1;.3" dur="4.1s" repeatCount="indefinite"/></circle>
    </g>
    <g fill="#9B8CFF">
      <circle cx="260" cy="190" r="1.8"><animate attributeName="opacity" values=".2;.8;.2" dur="3.8s" repeatCount="indefinite"/></circle>
      <circle cx="465" cy="104" r="1.8"><animate attributeName="opacity" values=".2;.9;.2" dur="4.4s" repeatCount="indefinite"/></circle>
      <circle cx="700" cy="178" r="2"><animate attributeName="opacity" values=".2;.8;.2" dur="3.5s" repeatCount="indefinite"/></circle>
      <circle cx="920" cy="148" r="1.8"><animate attributeName="opacity" values=".2;.9;.2" dur="4.8s" repeatCount="indefinite"/></circle>
    </g>
    <g fill="#AEBBCD" fill-opacity=".7">
      <circle cx="105" cy="98" r="1"/><circle cx="219" cy="235" r="1"/><circle cx="413" cy="219" r="1"/>
      <circle cx="518" cy="137" r="1"/><circle cx="738" cy="111" r="1"/><circle cx="856" cy="82" r="1"/>
      <circle cx="990" cy="220" r="1"/><circle cx="1128" cy="165" r="1"/>
    </g>
    <text x="30" y="274" fill="#8495A9" font-family="monospace" font-size="10" letter-spacing="2">CONCEPT / EXPERIMENT / ITERATION</text>
    <text x="1170" y="274" text-anchor="end" fill="#8495A9" font-family="monospace" font-size="10" letter-spacing="2">NO FIXED PATH</text>
  </g>
  <rect x=".75" y=".75" width="1198.5" height="298.5" rx="14" fill="none" stroke="#26394B" stroke-width="1.5"/>
</svg>