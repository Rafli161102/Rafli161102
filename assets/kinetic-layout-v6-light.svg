<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="450" viewBox="0 0 1200 450" role="img" aria-labelledby="title desc">
<title id="title">Kinetic Layout — measured responsive compositions</title>
<desc id="desc">Six layout modules move between three non-overlapping grid compositions. Each panel shows exact width, height, and relative area. Labels are hidden during movement and shown when the layout settles.</desc>
