<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="742" viewBox="0 0 1200 742" role="img" aria-labelledby="title desc">
<title id="title">Rafli Ramadhan — design with clarity</title>
<desc id="desc">A white editorial portfolio cover with a golden-ratio split, restrained blue colour, modular graphic studies, and subtle movement.</desc>
<defs>
