      </rect>
      <text x="130" y="199" font-size="7" letter-spacing=".6" fill="#60758F">M / MEDIUM</text>
      <text x="130" y="208" font-size="8" font-weight="700" fill="#294565">128 × 80 px</text>

      <rect x="222" y="189" width="98" height="24" rx="3" fill="#F4F7FB" stroke="#D7E2EF">
        <animate attributeName="stroke" values="#D7E2EF;#D7E2EF;#426EA5;#D7E2EF;#D7E2EF" keyTimes="0;.42;.48;.65;1" dur="16s" repeatCount="indefinite"/>
