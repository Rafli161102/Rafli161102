  <text x="47" y="214" font-family="Arial,Helvetica,sans-serif" font-size="56" font-weight="700" letter-spacing="-1.8" fill="#203752">Design with</text>
  <text x="47" y="278" font-family="Arial,Helvetica,sans-serif" font-size="56" font-weight="700" letter-spacing="-1.8" fill="#203752">clarity.</text>
  <text x="50" y="330" font-family="Arial,Helvetica,sans-serif" font-size="26" fill="#6A819B">Build with curiosity.</text>
  <path d="M50 367H654" stroke="#DDE6F0"/>
  <text x="50" y="405" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#516981">Visual identity, print-ready artwork, digital ideas,</text>
  <text x="50" y="433" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#516981">and prototypes shaped with AI-assisted tools.</text>

