<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
  <title id="title">Muhammad Rafli Ramadhan — Creative Practice</title>
  <desc id="desc">A quiet editorial portfolio header using a soft blue palette, typography, layout guides, and graphic design swatches.</desc>
  <defs>
    <pattern id="paperGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#DCE5F0" stroke-width=".7"/>
    </pattern>
    <clipPath id="canvas"><rect x="1" y="1" width="1198" height="338" rx="12"/></clipPath>
  </defs>
  <g clip-path="url(#canvas)">
