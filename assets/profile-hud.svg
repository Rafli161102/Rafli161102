    <rect x="0" y="0" width="1200" height="340" fill="url(#paperGrid)" opacity=".65"/>
    <rect x="24" y="24" width="1152" height="292" rx="6" fill="#FFFFFF" stroke="#D8E2EE"/>
    <path d="M24 66H1176" stroke="#D8E2EE"/>
    <text x="48" y="50" fill="#48617E" font-family="Arial, Helvetica, sans-serif" font-size="12" letter-spacing="2">MRR  /  CREATIVE PRACTICE</text>
