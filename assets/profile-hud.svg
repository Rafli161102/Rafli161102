    <text x="48" y="110" fill="#426EA5" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" letter-spacing="2.4">MUHAMMAD RAFLI RAMADHAN</text>
    <text x="46" y="158" fill="#203752" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" letter-spacing=".2">Ideas, shaped with intent.</text>
    <text x="48" y="188" fill="#63758B" font-family="Arial, Helvetica, sans-serif" font-size="17">Graphic design, creative strategy, and AI-assisted building.</text>
    <path d="M48 210H570" stroke="#D8E2EE"/>
    <text x="48" y="238" fill="#344D6D" font-family="Arial, Helvetica, sans-serif" font-size="13">VISUAL SYSTEMS</text>
