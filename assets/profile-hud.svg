    <text x="378" y="238" fill="#344D6D" font-family="Arial, Helvetica, sans-serif" font-size="13">PROTOTYPES</text>
    <text x="48" y="282" fill="#7B8DA3" font-family="Arial, Helvetica, sans-serif" font-size="11" letter-spacing="1.2">MAKE IT CLEAR. MAKE IT USEFUL. REFINE THE DETAILS.</text>

