<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-labelledby="title desc">
<title id="title">Creative cycle — brief, design, build, refine</title><desc id="desc">A clean horizontal process diagram with a quiet animated line and marker passing through four stages.</desc>
<rect width="1200" height="260" rx="12" fill="#151D28"/><path d="M22 48H1178" stroke="#2E3C50"/><text x="28" y="30" font-family="Arial,Helvetica,sans-serif" font-size="11" letter-spacing="1.6" fill="#9BAEC4">WORKING RHYTHM / 01</text>
<path d="M105 116H1095" stroke="#D5E0ED" stroke-width="3" stroke-linecap="round"/><path d="M105 116H1095" stroke="#7CA0CE" stroke-width="1.7" stroke-dasharray="6 12" stroke-linecap="round"/>
<g font-family="Arial,Helvetica,sans-serif"><g><circle cx="105" cy="116" r="23" fill="#F0F5FB" stroke="#ADC4E0" stroke-width="1.5"/><text x="105" y="121" text-anchor="middle" font-size="14" font-weight="700" fill="#82AEE8">01</text><text x="105" y="166" text-anchor="middle" font-size="16" font-weight="700" fill="#233D5A">Brief</text><text x="105" y="188" text-anchor="middle" font-size="12" fill="#9BAEC4">Understand the goal</text></g>
<g><circle cx="435" cy="116" r="23" fill="#F0F5FB" stroke="#ADC4E0" stroke-width="1.5"/><text x="435" y="121" text-anchor="middle" font-size="14" font-weight="700" fill="#82AEE8">02</text><text x="435" y="166" text-anchor="middle" font-size="16" font-weight="700" fill="#233D5A">Design</text><text x="435" y="188" text-anchor="middle" font-size="12" fill="#9BAEC4">Shape the experience</text></g>
<g><circle cx="765" cy="116" r="23" fill="#F0F5FB" stroke="#ADC4E0" stroke-width="1.5"/><text x="765" y="121" text-anchor="middle" font-size="14" font-weight="700" fill="#82AEE8">03</text><text x="765" y="166" text-anchor="middle" font-size="16" font-weight="700" fill="#233D5A">Build</text><text x="765" y="188" text-anchor="middle" font-size="12" fill="#9BAEC4">Make it testable</text></g>
<g><circle cx="1095" cy="116" r="23" fill="#F0F5FB" stroke="#ADC4E0" stroke-width="1.5"/><text x="1095" y="121" text-anchor="middle" font-size="14" font-weight="700" fill="#82AEE8">04</text><text x="1095" y="166" text-anchor="middle" font-size="16" font-weight="700" fill="#233D5A">Refine</text><text x="1095" y="188" text-anchor="middle" font-size="12" fill="#9BAEC4">Test and adjust</text></g></g>
<circle r="6" fill="#82AEE8" stroke="#151D28" stroke-width="3"><animateMotion dur="8s" repeatCount="indefinite" path="M105 116H1095"/></circle>
<path d="M105 218H1095" stroke="#2E3C50"/><text x="105" y="239" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="10" letter-spacing="1" fill="#9BAEC4">OBSERVE</text><text x="435" y="239" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="10" letter-spacing="1" fill="#9BAEC4">COMPOSE</text><text x="765" y="239" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="10" letter-spacing="1" fill="#9BAEC4">PROTOTYPE</text><text x="1095" y="239" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="10" letter-spacing="1" fill="#9BAEC4">ITERATE</text>
<rect x=".75" y=".75" width="1198.5" height="258.5" rx="12" fill="none" stroke="#354458" stroke-width="1.5"/>
