<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="220" viewBox="0 0 1200 220" role="img" aria-labelledby="title desc">
<title id="title">Type studio — hierarchy and spacing</title><desc id="desc">A white editorial typography study with blue type, a measured type scale, and a moving underline.</desc>
<rect width="1200" height="220" rx="12" fill="#151D28"/><path d="M24 40H1176" stroke="#2E3C50"/><text x="28" y="26" font-family="Arial,Helvetica,sans-serif" font-size="11" letter-spacing="1.5" fill="#9BAEC4">TYPE STUDIO / HIERARCHY &amp; RHYTHM</text>
<text x="32" y="96" font-family="Arial,Helvetica,sans-serif" font-size="45" font-weight="700" letter-spacing="-1.2" fill="#203752">Make it clear.</text><text x="34" y="127" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#B7C6D7">One strong idea. A thoughtful grid. No extra noise.</text>
<rect x="34" y="142" width="0" height="4" rx="2" fill="#82AEE8"><animate attributeName="width" values="0;330;330;0" keyTimes="0;.45;.72;1" dur="7.5s" repeatCount="indefinite"/></rect>
<g transform="translate(754 62)"><text x="0" y="0" font-family="Arial,Helvetica,sans-serif" font-size="10" letter-spacing="1.2" fill="#9BAEC4">TYPE SCALE</text><text x="0" y="48" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="700" fill="#82AEE8">Aa</text><text x="73" y="48" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#203752">Aa</text><text x="132" y="48" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#A3B4C8">Aa</text><text x="180" y="48" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#9BAEC4">Aa</text><path d="M0 67H390" stroke="#354458"/><text x="0" y="91" font-family="Arial,Helvetica,sans-serif" font-size="10" letter-spacing="1" fill="#9BAEC4">WEIGHT / SIZE / SPACE</text></g>
<rect x=".75" y=".75" width="1198.5" height="218.5" rx="12" fill="none" stroke="#354458" stroke-width="1.5"/>
</svg>