<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="190" viewBox="0 0 1200 190" role="img" aria-labelledby="t d">
<title id="t">Creative process — from brief to refinement</title><desc id="d">A minimal blue process line with four stages and a marker moving along the path.</desc>
<rect width="1200" height="190" rx="10" fill="#F8FAFD"/><path d="M40 30H1160" stroke="#E0E8F1"/>
<text x="28" y="21" font-family="Arial,Helvetica,sans-serif" font-size="10" letter-spacing="1.5" fill="#7C8EA5">A SIMPLE WORKING RHYTHM</text>
<path d="M115 91H1085" stroke="#CEDAE8" stroke-width="3" stroke-linecap="round"/><path d="M115 91H1085" stroke="#7DA0CB" stroke-width="1.5" stroke-dasharray="4 12"/>
<g font-family="Arial,Helvetica,sans-serif">
<circle cx="115" cy="91" r="20" fill="#E6EEF8" stroke="#9FB9D8" stroke-width="1.5"/><text x="115" y="96" text-anchor="middle" font-size="13" font-weight="700" fill="#426EA5">01</text><text x="115" y="133" text-anchor="middle" font-size="14" font-weight="700" fill="#29435F">Brief</text><text x="115" y="151" text-anchor="middle" font-size="11" fill="#7B8DA3">Understand the goal</text>
<circle cx="438" cy="91" r="20" fill="#E6EEF8" stroke="#9FB9D8" stroke-width="1.5"/><text x="438" y="96" text-anchor="middle" font-size="13" font-weight="700" fill="#426EA5">02</text><text x="438" y="133" text-anchor="middle" font-size="14" font-weight="700" fill="#29435F">Design</text><text x="438" y="151" text-anchor="middle" font-size="11" fill="#7B8DA3">Shape the experience</text>
<circle cx="762" cy="91" r="20" fill="#E6EEF8" stroke="#9FB9D8" stroke-width="1.5"/><text x="762" y="96" text-anchor="middle" font-size="13" font-weight="700" fill="#426EA5">03</text><text x="762" y="133" text-anchor="middle" font-size="14" font-weight="700" fill="#29435F">Build</text><text x="762" y="151" text-anchor="middle" font-size="11" fill="#7B8DA3">Make it testable</text>
<circle cx="1085" cy="91" r="20" fill="#E6EEF8" stroke="#9FB9D8" stroke-width="1.5"/><text x="1085" y="96" text-anchor="middle" font-size="13" font-weight="700" fill="#426EA5">04</text><text x="1085" y="133" text-anchor="middle" font-size="14" font-weight="700" fill="#29435F">Refine</text><text x="1085" y="151" text-anchor="middle" font-size="11" fill="#7B8DA3">Test and adjust</text>
</g>
