<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="190" viewBox="0 0 1200 190" role="img" aria-labelledby="title desc">
<title id="title">Blue palette — ink, blue, mist, cloud, paper</title><desc id="desc">A minimal five-swatch colour study with restrained motion around one blue colour selection.</desc>
<rect width="1200" height="190" rx="12" fill="#FFFFFF"/><text x="24" y="27" font-family="Arial,Helvetica,sans-serif" font-size="11" letter-spacing="1.5" fill="#8292A7">COLOUR STUDY / BLUE NOTES</text>
<g transform="translate(24 44)" font-family="Arial,Helvetica,sans-serif"><g><rect width="210" height="82" rx="4" fill="#203752"/><text x="0" y="105" font-size="11" fill="#536B87">01 / INK</text><text x="0" y="120" font-size="9" fill="#8797AA">#203752</text></g><g transform="translate(228 0)"><rect width="210" height="82" rx="4" fill="#426EA5"/><rect width="210" height="82" rx="4" fill="none" stroke="#426EA5" stroke-width="3"><animate attributeName="stroke-opacity" values=".25;1;.25" dur="5s" repeatCount="indefinite"/></rect><text x="0" y="105" font-size="11" fill="#536B87">02 / BLUE</text><text x="0" y="120" font-size="9" fill="#8797AA">#426EA5</text></g><g transform="translate(456 0)"><rect width="210" height="82" rx="4" fill="#8EACD1"><animate attributeName="opacity" values=".85;1;.85" dur="5s" repeatCount="indefinite"/></rect><text x="0" y="105" font-size="11" fill="#536B87">03 / MIST</text><text x="0" y="120" font-size="9" fill="#8797AA">#8EACD1</text></g><g transform="translate(684 0)"><rect width="210" height="82" rx="4" fill="#D7E3F1"/><text x="0" y="105" font-size="11" fill="#536B87">04 / CLOUD</text><text x="0" y="120" font-size="9" fill="#8797AA">#D7E3F1</text></g><g transform="translate(912 0)"><rect width="210" height="82" rx="4" fill="#FAFBFD" stroke="#D7E3F1"/><text x="0" y="105" font-size="11" fill="#536B87">05 / PAPER</text><text x="0" y="120" font-size="9" fill="#8797AA">#FAFBFD</text></g></g><path d="M24 168H1176" stroke="#E0E8F1"/><text x="24" y="182" font-family="Arial,Helvetica,sans-serif" font-size="9" letter-spacing="1.2" fill="#91A0B2">A SMALL SYSTEM, USED CONSISTENTLY.</text>
<rect x=".75" y=".75" width="1198.5" height="188.5" rx="12" fill="none" stroke="#D7E1EF" stroke-width="1.5"/>
