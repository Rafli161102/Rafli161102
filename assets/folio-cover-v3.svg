  <path d="M50 556H654" stroke="#DDE6F0"/>
  <text x="50" y="591" font-family="Arial,Helvetica,sans-serif" font-size="12" letter-spacing="1.1" fill="#7B8EA5">THINK → MAKE → TEST → REFINE</text>
  <text x="50" y="674" font-family="Arial,Helvetica,sans-serif" font-size="11" letter-spacing="1.5" fill="#97A5B6">A PERSONAL WORKSPACE FOR IDEAS IN PROGRESS</text>

