<title id="title">Rafli Ramadhan — word-by-word typography carousel</title>
<desc id="desc">The words Design, Create, Build, and Shape slide upward; the word with stays fixed; Clarity, Purpose, Intent, and Care slide downward. The typeface changes for each word with no opacity fade.</desc>
<defs><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#ECF1F7" stroke-width=".8"/></pattern><clipPath id="canvas"><rect x="1" y="1" width="1198" height="740" rx="16"/></clipPath><clipPath id="left-word-window"><rect x="40" y="163" width="166" height="78"/></clipPath><clipPath id="right-word-window"><rect x="310" y="163" width="390" height="78"/></clipPath></defs>
