<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="190" viewBox="0 0 1200 190" role="img" aria-labelledby="title desc">
<title id="title">Blue palette — ink, blue, mist, cloud, paper</title><desc id="desc">A minimal five-swatch colour study with restrained motion around one blue colour selection.</desc>
<rect width="1200" height="190" rx="12" fill="#151D28"/><text x="24" y="27" font-family="Arial,Helvetica,sans-serif" font-size="11" letter-spacing="1.5" fill="#9BAEC4">COLOUR STUDY / BLUE NOTES</text>
<g transform="translate(24 44)" font-family="Arial,Helvetica,sans-serif"><g><rect width="210" height="82" rx="4" fill="#203752"/><text x="0" y="105" font-size="11" fill="#A3B4C8">01 / INK</text><text x="0" y="120" font-size="9" fill="#91A4BA">#203752</text></g><g transform="translate(228 0)"><rect width="210" height="82" rx="4" fill="#82AEE8"/><rect width="210" height="82" rx="4" fill="none" stroke="#82AEE8" stroke-width="3"><animate attributeName="stroke-opacity" values=".25;1;.25" dur="5s" repeatCount="indefinite"/></rect><text x="0" y="105" font-size="11" fill="#A3B4C8">02 / BLUE</text><text x="0" y="120" font-size="9" fill="#91A4BA">#82AEE8</text></g><g transform="translate(456 0)"><rect width="210" height="82" rx="4" fill="#5E80AA"><animate attributeName="opacity" values=".85;1;.85" dur="5s" repeatCount="indefinite"/></rect><text x="0" y="105" font-size="11" fill="#A3B4C8">03 / MIST</text><text x="0" y="120" font-size="9" fill="#91A4BA">#5E80AA</text></g><g transform="translate(684 0)"><rect width="210" height="82" rx="4" fill="#26384D"/><text x="0" y="105" font-size="11" fill="#A3B4C8">04 / CLOUD</text><text x="0" y="120" font-size="9" fill="#91A4BA">#26384D</text></g><g transform="translate(912 0)"><rect width="210" height="82" rx="4" fill="#FAFBFD" stroke="#26384D"/><text x="0" y="105" font-size="11" fill="#A3B4C8">05 / PAPER</text><text x="0" y="120" font-size="9" fill="#91A4BA">#FAFBFD</text></g></g><path d="M24 168H1176" stroke="#2E3C50"/><text x="24" y="182" font-family="Arial,Helvetica,sans-serif" font-size="9" letter-spacing="1.2" fill="#91A0B2">A SMALL SYSTEM, USED CONSISTENTLY.</text>
<rect x=".75" y=".75" width="1198.5" height="188.5" rx="12" fill="none" stroke="#354458" stroke-width="1.5"/>
