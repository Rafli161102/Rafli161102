<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="150" viewBox="0 0 1200 150" role="img" aria-labelledby="t d">
<title id="t">Palette study — restrained blue tones</title><desc id="d">A minimal animated palette of ink, cobalt, cornflower, mist, and paper tones, with a subtle focus indicator.</desc>
<rect width="1200" height="150" rx="10" fill="#F8FAFD"/><text x="24" y="23" font-family="Arial,Helvetica,sans-serif" font-size="10" letter-spacing="1.5" fill="#7C8EA5">PALETTE STUDY / BLUE NOTES</text>
<g transform="translate(24 37)" font-family="Arial,Helvetica,sans-serif">
<g><rect width="210" height="74" rx="4" fill="#203752"/><text x="12" y="94" font-size="11" fill="#536B87">01 / INK</text><text x="12" y="107" font-size="9" fill="#8797AA">#203752</text></g>
<g transform="translate(228 0)"><rect width="210" height="74" rx="4" fill="#426EA5"/><text x="12" y="94" font-size="11" fill="#536B87">02 / BLUE</text><text x="12" y="107" font-size="9" fill="#8797AA">#426EA5</text></g>
<g transform="translate(456 0)"><rect width="210" height="74" rx="4" fill="#8EACD1"><animate attributeName="opacity" values=".8;1;.8" dur="5s" repeatCount="indefinite"/></rect><text x="12" y="94" font-size="11" fill="#536B87">03 / MIST</text><text x="12" y="107" font-size="9" fill="#8797AA">#8EACD1</text></g>
<g transform="translate(684 0)"><rect width="210" height="74" rx="4" fill="#D7E3F1"/><text x="12" y="94" font-size="11" fill="#536B87">04 / CLOUD</text><text x="12" y="107" font-size="9" fill="#8797AA">#D7E3F1</text></g>
<g transform="translate(912 0)"><rect width="210" height="74" rx="4" fill="#FFFFFF" stroke="#D7E3F1"/><text x="12" y="94" font-size="11" fill="#536B87">05 / PAPER</text><text x="12" y="107" font-size="9" fill="#8797AA">#FFFFFF</text><rect x="0" y="0" width="210" height="74" rx="4" fill="none" stroke="#426EA5" stroke-width="2" stroke-dasharray="4 8"><animate attributeName="stroke-dashoffset" values="0;-24" dur="8s" repeatCount="indefinite"/></rect></g>
